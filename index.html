// Jeu fictif commun aux essais connectés et à la démonstration autonome.
function sampleDayPlan(day, settings, existingVideos = [], demo = false) {
  const plus = (n) => {
    const d = new Date(day + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const cohort = (new Date(day + 'T12:00:00Z').getUTCDay() + 6) % 7;
  const card = (i) =>
    demo
      ? 'ESSAI-' + (700 + cohort * 150 + i)
      : String(900100 + cohort * 150 + i).padStart(7, '0');
  const names = [
    'Lina',
    'Noé',
    'Camille',
    'Sacha',
    'Mila',
    'Adam',
    'Lou',
    'Jules',
    'Inès',
    'Robin',
    'Nina',
    'Alex',
    'Éden',
    'Léa',
    'Maël',
    'Zoé',
    'Charlie',
    'Élie',
    'Jade',
    'Tom',
  ];
  const people = Array.from({ length: 120 }, (_, i) => ({
    carte: card(i),
    prenom: names[i % names.length],
    nom: 'Démo ' + String(i + 1).padStart(3, '0'),
    date_naissance: (i % 3 === 0 ? '1990' : '2015') + '-05-12',
    note_interne:
      i % 12 === 0 ? 'Fiche fictive destinée aux essais du guichet.' : null,
  }));
  const boxes = Object.fromEntries(
    [
      'Les aventuriers du rail',
      'Dixit',
      'Azul',
      'Dobble',
      'Kingdomino',
      'Carcassonne',
    ].map((title, i) => [
      'DEMO-' + (i + 1),
      { title: 'DÉMO · ' + title, sector: i % 2 ? 'Pop Zone' : 'Jeunesse' },
    ]),
  );
  const boards = Array.from({ length: 28 }, (_, i) => ({
    date: day,
    card: card(i),
    box: 'DEMO-' + ((i % 6) + 1),
    sector: i % 2 ? 'Pop Zone' : 'Jeunesse',
    kids: 1 + (i % 3),
    adults: i % 3 === 0 ? 1 : 0,
    sampleKey: 'soc-' + i,
  }));
  const videos = [];
  let player = 30;
  for (const [post, base] of Object.entries(settings.stations)) {
    const cfg = {
      ...base,
      ...base.weekdays?.[new Date(day + 'T12:00:00').getDay()],
      ...base.exceptions?.[day],
    };
    if (cfg.enabled === false || settings.closedDates?.includes(day)) continue;
    for (const [index, range] of cfg.slots.slice(0, 4).entries()) {
      const occupied = existingVideos.filter(
        (x) =>
          x.date === day && x.post === post && x.slot === range.slice(0, 5),
      );

// Mutualiser les lectures en cours pour éviter des rafraîchissements concurrents.
async function refresh(force = false) {
  if (refreshPromise) {
    await refreshPromise;
    if (!force) return;
  }
  refreshPromise = (async () => {
    try {
      const [next, list, profile] = await Promise.all([
        api.state(),
        api.list(),
        api.currentProfile(),
      ]);
      const changed =
        api.profile !== profile ||
        JSON.stringify(state) !== JSON.stringify(next) ||
        JSON.stringify(Object.values(people)) !== JSON.stringify(list);
      api.profile = profile;
      state = next;
      people = Object.fromEntries(list.map((p) => [p.carte, p]));
      if (changed) render();
      for (const input of document.querySelectorAll('input[name=card]'))
        updateKnown(input);
      if ($('syncStatus'))
        $('syncStatus').textContent =
          'Données partagées synchronisées · ' +
          new Date().toLocaleTimeString('fr-FR');
    } catch (error) {
      if ($('syncStatus'))
        $('syncStatus').textContent = 'Non synchronisé : ' + error.message;
      throw error;
    } finally {
      refreshPromise = null;
    }
  })();
  return refreshPromise;
}

// Centraliser la soumission, la reprise après erreur et l’annulation éventuelle.
async function submit(form, msg, action, data, onSuccess, undo) {
  if (form.dataset.saving) return;
  const controls = [
    ...form.querySelectorAll('input,select,textarea,button'),
  ].filter((x) => !x.disabled);
  form.dataset.saving = '1';
  controls.forEach((x) => (x.disabled = true));
  const operation = form.dataset.operation || crypto.randomUUID();
  form.dataset.operation = operation;
  let focus;
  try {
    const result =
      typeof action === 'function'
        ? await action()
        : await api.command(action, data, operation);
    await refresh(true);
    if (undo) {
      lastUndo = undo(result);
      $('undo').disabled = false;
    } else if (typeof action === 'string') {
      lastUndo = null;
      $('undo').disabled = true;
    }
    focus = await onSuccess?.(result);
    delete form.dataset.operation;
    return true;
  } catch (error) {
    $(msg).textContent =
      'Écriture non confirmée. Saisie conservée. ' + error.message;
    conflict(error, form);
  } finally {
    delete form.dataset.saving;
    controls.forEach((x) => (x.disabled = false));
    focus?.focus();
  }
}

function userList() {
  const query = $('filterUsers').value;
  const users = Object.values(people)
    .filter((person) => matchesPerson(person, query))
    .sort((a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr') ||
      (a.prenom || '').localeCompare(b.prenom || '', 'fr') ||
      a.carte.localeCompare(b.carte));
  userPage = Math.min(userPage, Math.max(0, Math.ceil(users.length / pageSize) - 1));
  const from = userPage * pageSize;
  const pageUsers = users.slice(from, from + pageSize);
  $('userList').innerHTML = users.length
    ? '<table><thead><tr><th scope="col">Nom</th><th scope="col">Prénom</th><th scope="col">Carte</th><th scope="col">Fiche</th></tr></thead><tbody>' +
      pageUsers.map((person) => `<tr><td>${esc(person.nom || '—')}</td><td>${esc(person.prenom || '—')}</td><td>${esc(person.carte)}</td><td><button type="button" data-person="${esc(person.carte)}" aria-label="Ouvrir la fiche ${esc(cardLabel(person.carte))}">Ouvrir</button></td></tr>`).join('') +
      '</tbody></table>'
    : '<p>Aucun usager trouvé.</p>';
  $('userPagination').hidden = users.length <= pageSize;
  $('userPrev').disabled = userPage === 0;
  $('userNext').disabled = from + pageSize >= users.length;
  $('userRange').textContent = `${from + 1}–${from + pageUsers.length} sur ${users.length}`;

  const request = ++personRequest;

  const loadingForm = $('personForm');
  for (const input of loadingForm.elements) input.disabled = true;
  try {
    if (card) p = await api.get(card);

function defaultSlot(slots, date) {

function videoForm(moving = [], picked = {}) {

    date = initial.date || day(),

  }
  function availability(reset = false) {
    const cfg = station(f.post.value, f.date.value);
    const current = f.slot.value;
    const closed =
      !cfg ||
      cfg.enabled === false ||
      state.settings.closedDates?.includes(f.date.value);
    const noGames = !cfg?.games?.length;
    form.querySelector('button.primary').disabled = closed || noGames;
    if (reset) {
      f.slot.innerHTML = opts(
        (closed ? [] : cfg.slots || []).map((s) => s.slice(0, 5)),
        initial.slot || defaultSlot(cfg?.slots || [], f.date.value) || current,
      );
    }
    const bookings = state.videos.filter(
      (x) =>
        x.date === f.date.value &&
        x.post === f.post.value &&
        x.slot === f.slot.value &&
        !moving.some((m) => m.id === x.id),
    );
    const remaining =
      cfg?.enabled === false ||
      state.settings.closedDates?.includes(f.date.value)
        ? 0
        : (cfg?.capacity || 0) - bookings.length;
    const shared = bookings[0]?.game,

    f.game.innerHTML =

    $('vfmsg').textContent = closed

        'Aucun créneau',

      .filter(Boolean)
      .join(' · ');
    alternatives(form, moving);
    return remaining;
  }
  f.post.onchange = f.date.onchange = () => availability(true);
  f.slot.onchange = f.game.onchange = () => availability();
  form.addEventListener('input', () => alternatives(form, moving));
  availability(true);
  form.onsubmit = (e) => {
    e.preventDefault();
    const group = players(form),
      data = {
        date: f.date.value,
        post: f.post.value,
        slot: f.slot.value,
        game: f.game.value,
        ...(moving.length ? { rows: rows(moving) } : { players: group }),
      };
    submit(
      form,
      'vfmsg',
      moving.length ? 'video.move' : 'video.book',
      data,
      (result) => {
        queue(group.map((p) => p.card));
        lastVideo = {
          date: data.date,
          post: data.post,
          slot: data.slot,
          game: data.game,
        };
        if (moving.length) {
          $('modal').close();
          notice('Joueurs déplacés.');
          return;

        form.querySelector('.players').innerHTML = playerRow();
        bindRemovals(form);
        availability();
        $('vfmsg').textContent =
          'Inscription enregistrée. ' + $('vfmsg').textContent;

// Calendrier mensuel et séances récurrentes.
function calendar() {
  $('month').textContent = month.toLocaleDateString('fr-FR', {
    month: 'long',
    year: 'numeric',
  });
  const grid = $('calendar');
  grid.innerHTML = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim']
    .map((d) => '<b>' + d + '</b>')
    .join('');
  for (let i = 0; i < (month.getDay() + 6) % 7; i++)
    grid.append(document.createElement('span'));
  for (
    let n = 1;
    n <= new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
    n++
  ) {
    const date = iso(new Date(month.getFullYear(), month.getMonth(), n)),
      summaries = calendarSummaries(date),
      b = document.createElement('button');
    b.className =
      'day' + (date === day() ? ' today' : '') + (summaries.length ? ' busy' : '');
    b.dataset.date = date;
    b.setAttribute('aria-pressed', String(date === selectedDate));
    if (activeTab === 'ani' && beyondHorizon(date)) {
      b.classList.add('beyondHorizon');
      b.title = 'Au-delà de J+15 : confirmation nécessaire pour inscrire';
    }
    b.textContent = n;
    b.setAttribute('aria-label', [labelDate(date), ...summaries].join(' · '));
    for (const summary of summaries) {
      const s = document.createElement('small');
      s.textContent = summary;
      b.append(s);
    }
    b.onclick = () => selectActivityDate(date, true);
    b.onkeydown = (e) => {
      const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[
        e.key
      ];
      if (step) {
        e.preventDefault();
        const d = new Date(date + 'T12:00:00');
        d.setDate(d.getDate() + step);
        month = new Date(d.getFullYear(), d.getMonth(), 1);
        calendar();
        document.querySelector(`[data-date="${iso(d)}"]`)?.focus();
      }
    };
    grid.append(b);
  }
}
function calendarSummaries(date) {
  if (activeTab === 'ani') return state.events.filter((event) => event.date === date).map((event) => event.title);
  if (activeTab === 'soc') {
    const count = state.boards.filter((board) => board.date === date && board.sector === $('sector').value).length;
    return count ? [count + ' consultation(s)'] : [];

  const count = state.videos.filter((video) => video.date === date).length;
  if (count) return [count + ' réservation(s)'];
  const open = !state.settings.closedDates?.includes(date) &&
    Object.keys(state.settings.stations).some((post) => {
      const config = station(post, date);

  const form = e.target,
    f = form.elements,
    cfg = structuredClone(state.settings),
    source = form.dataset.postKey || '',
    key = f.postName.value.trim();
  let renamePost;
  if (adminSection === 'postes') {
    if (
      !key ||
      key.length > 50 ||
      ['__proto__', 'constructor', 'prototype'].includes(key)
    ) {
      $('configMsg').textContent =
        'Choisir un nom de poste de 1 à 50 caractères.';
      return;
    }
    if (
      Object.keys(cfg.stations).some(
        (k) =>
          k !== source &&
          k.toLocaleLowerCase('fr') === key.toLocaleLowerCase('fr'),
      )
    ) {
      $('configMsg').textContent =
        'Ce nom est déjà utilisé par un autre poste.';
      return;
    }
    let p = {
      ...cfg.stations[source],
      capacity: +f.capacity.value,
      games: lines(f.games.value),
      slots: lines(f.slots.value)
        .map((s) => s.replace(/\s*[-–]\s*/g, '–'))
        .sort(),
      enabled: f.enabled.checked,
      instruction: f.instruction.value.trim(),
    };
    if (f.weekday.value !== 'default') {
      const base = cfg.stations[source];
      p = {
        ...base,
        weekdays: {
          ...base.weekdays,
          [f.weekday.value]: {
            capacity: p.capacity,
            games: p.games,
            slots: p.slots,
            enabled: p.enabled,
            instruction: p.instruction,
          },
        },
      };
    }
    if (f.exceptionDate.value && form.dataset.exceptionDirty) {
      p.exceptions = { ...p.exceptions };
      if (form.dataset.exceptionRemove) delete p.exceptions[f.exceptionDate.value];
      else p.exceptions[f.exceptionDate.value] = {
        enabled: !f.exceptionClosed.checked,
        ...(f.exceptionSlots.value.trim()
          ? {
              slots: lines(f.exceptionSlots.value)
                .map((s) => s.replace(/\s*[-–]\s*/g, '–'))
                .sort(),
            }
          : {}),
        ...(f.exceptionGames.value.trim()
          ? { games: lines(f.exceptionGames.value) }
          : {}),
      };
    }
    if (source && source !== key) {
      renamePost = { source, target: key };
      delete cfg.stations[source];
    }
    const alias = f.postAlias.value.trim();
    if (p.alias !== undefined || alias !== (stationUse[key] || '')) p.alias = alias;
    cfg.stations[key] = p;
    cfg.closedDates = lines(f.closedDates.value);
  } else if (adminSection === 'animations') {
    cfg.eventTypes = lines(f.eventTypes.value);
  } else if (adminSection === 'acces') {
    cfg.manageEvents = f.manageEvents.checked;
    cfg.permissions = {
      ...cfg.permissions,
      edit: f['permission-edit'].checked,
      cancel: f['permission-cancel'].checked,
      bulk: false,
      export: false,
      templates: f['permission-templates'].checked,
    };
  } else if (adminSection === 'societe') {
    const code = f.boxCode.value.trim();
    if (!code || !f.boxTitle.value.trim()) {
      $('configMsg').textContent =
        'Renseigner le numéro et le titre de la boîte.';
      return;
    }
    if (['__proto__', 'constructor', 'prototype'].includes(code)) {
      $('configMsg').textContent = 'Choisir un autre numéro de boîte.';
      return;
    }
    cfg.boxes = {
      ...cfg.boxes,
      [code]: { title: f.boxTitle.value.trim(), sector: f.boxSector.value },
    };
  }
  const closing =
    adminSection === 'postes'
      ? state.videos.filter((a) => {
          if (a.date < day()) return false;
          const post = renamePost && a.post === source ? key : a.post,
            base = cfg.stations[post],
            next = {
              ...base,
              ...base?.weekdays?.[new Date(a.date + 'T12:00:00').getDay()],
              ...base?.exceptions?.[a.date],
            };
          return next.enabled === false || cfg.closedDates.includes(a.date);
        })
      : [];
  if (
    closing.length &&
    !confirm(
      'Êtes-vous sûr de fermer ? ' +
        closing.length +
        ' réservation(s) seront retirées et placées dans la corbeille.',
    )
  )
    return;
  const section = adminSection,
    box = f.boxCode.value.trim();
  submit(
    form,
    'configMsg',
    'config.save',
    {
      settings: cfg,
      revision: +form.dataset.revision,
      forceClose: closing.length > 0,
      ...(renamePost ? { renamePost } : {}),
    },
    () => {
      configList(adminSection === 'postes' ? key : source);
      if (section === 'societe') {
        readBoxList(box);
        loadBox(box);
      }
      notice('Réglages partagés enregistrés.');
      $('configMsg').textContent = renamePost
        ? 'Poste renommé. Ses réservations actives et en corbeille suivent le nouveau nom.'
        : 'Réglages « ' +
          adminLabels[section] +
          ' » enregistrés pour tous les postes.';
    },
  );
};

function addHour(time) {
  const n = Math.min(1439, +time.slice(0, 2) * 60 + +time.slice(3) + 60);
  return (
    String(Math.floor(n / 60)).padStart(2, '0') +
    ':' +
    String(n % 60).padStart(2, '0')
  );
}

// Construire le planning du jour à partir des postes et réservations confirmées.
function renderVideoPlanning() {
  const today = tableFilters.videoToday !== false;
  $('videos').hidden = today;
  $('videoPlanning').hidden = !today;
  $('videoListTools').hidden = today;
  $('videoToday').setAttribute('aria-pressed', String(today));
  $('videoAll').setAttribute('aria-pressed', String(!today));
  const container = $('videoPlanning');
  container.replaceChildren();
  if (!today) return;
  const date = selectedDate || day();
  const posts = Object.keys(state.settings.stations),
    ranges = [
      ...new Set(posts.flatMap((p) => station(p, date)?.slots || [])),
    ].sort();
  const t = document.createElement('table');
  t.className = 'planningGrid';
  const caption = document.createElement('caption');
  caption.textContent = 'Planning JV du ' + labelDate(date);
  t.append(caption);
  const head = document.createElement('thead'),
    hr = document.createElement('tr');
  for (const label of ['Horaire', ...posts]) {
    const th = document.createElement('th');
    th.textContent = label === 'Horaire' ? label : stationLabel(label);
    hr.append(th);
  }
  head.append(hr);
  t.append(head);
  const body = document.createElement('tbody');
  t.append(body);
  for (const range of ranges) {
    const tr = document.createElement('tr');
    if (date === day() && range.slice(0, 5) <= nowTime() && range.slice(-5) > nowTime())
      tr.className = 'currentSlot';
    const time = document.createElement('th');
    time.scope = 'row';
    time.textContent = range;
    tr.append(time);
    for (const post of posts) {
      const td = document.createElement('td'),
        cfg = station(post, date);
      if (!cfg.slots.includes(range)) {
        td.textContent = 'Hors grille';
        td.className = 'unavailable';
        tr.append(td);
        continue;
      }

function statsDisplay() {
  const f = $('statsFilter').elements,
    groups = new Map();
  for (const row of statsRows) {
    if (
      [
        'activite',
        'secteur',
        'poste',
        'jeu',
        'boite',
        'salle',
        'type',
        'categorie',
      ].some((k) => f[k].value && row.dimensions[k] !== f[k].value)
    )
      continue;
    let period = row.jour;
    if (f.period.value === 'mois') period = period.slice(0, 7);
    if (f.period.value === 'semaine') {
      const date = new Date(period + 'T12:00:00');
      date.setDate(date.getDate() - ((date.getDay() + 6) % 7));
      period = iso(date);
    }
    const dims = row.dimensions,
      key = JSON.stringify([period, dims]),
      sum = groups.get(key) || {
        periode: period,
        ...dims,
        passages: 0,
        personnes: 0,
        enfants: 0,
        adultes: 0,
        accompagnateurs: 0,
      };
    for (const k of [
      'passages',
      'personnes',
      'enfants',
      'adultes',
      'accompagnateurs',
    ])
      sum[k] += row[k];
    groups.set(key, sum);
  }

const adminEditors = [];
function adminCollection(input, type, singular) {
  const wrapper = input.closest('label');
  const editor = document.createElement('fieldset');
  editor.className = 'collectionEditor';
  editor.dataset.collection = input.name;
  const legend = document.createElement('legend');
  legend.textContent = wrapper.firstChild.textContent.trim().replace(/ \(.*\)$/, '');
  const list = document.createElement('div');
  const add = document.createElement('button');
  add.type = 'button';
  add.textContent = 'Ajouter ' + singular;
  const sync = () => {
    const rows = [...list.children].map((row) => [...row.querySelectorAll('input')]);
    if (type !== 'range') {
      input.value = rows.map(([field]) => field.value).join('\n');
      return;
    }
    rows.sort(([a], [b]) => a.value.localeCompare(b.value));
    let previousEnd = '';
    input.value = rows.map(([start, end]) => {
      let error = '';
      if (start.value && end.value) {
        if (start.value >= end.value) error = 'La fin doit suivre le début.';
        else if (start.value < previousEnd) error = 'Ce créneau chevauche le précédent.';
        if (end.value > previousEnd) previousEnd = end.value;
      }
      end.setCustomValidity(error);
      return start.value + '–' + end.value;
    }).join('\n');
  };
  const append = (value = '') => {
    const row = document.createElement('div');
    row.className = 'collectionRow';
    const [start, end] = value.split('–');
    row.innerHTML = (type === 'range'
      ? field('Début', '', start, 'time', 'required') + field('Fin', '', end, 'time', 'required')
      : field(type === 'date' ? 'Date' : 'Intitulé', '', value, type, 'required maxlength="100"')) +
      '<button type="button" aria-label="Retirer ' + singular + '">Retirer</button>';
    list.append(row);
    row.querySelector('button').onclick = () => {
      row.remove();
      sync();
      input.dispatchEvent(new Event('input', { bubbles: true }));
      add.focus();
    };
    return row;
  };
  list.oninput = sync;
  add.onclick = () => {
    append().querySelector('input').focus();
    sync();
    input.dispatchEvent(new Event('input', { bubbles: true }));
  };
  input.required = false;
  wrapper.hidden = true;
  editor.append(legend, list, add);
  wrapper.after(editor);
  adminEditors.push(() => {
    list.replaceChildren();
    for (const value of lines(input.value)) append(value);
    sync();
  });
}

      return;
    }
    readConfig();
  };
  newPost.onclick = () => {
    if (!discardAdminDraft()) return;
    $('editPost').value = '';
    readConfig();
    f.postName.focus();
  };
  boxChoice.onchange = () => {
    const code = boxChoice.value;
    if (!discardAdminDraft()) {
      boxChoice.value = f.boxCode.value;
      return;
    }
    loadBox(code);
  };
  f.boxCode.onchange = () => {
    const box = state.settings.boxes?.[f.boxCode.value.trim()];
    if (box) {
      f.boxTitle.value = box.title;
      f.boxSector.value = box.sector;
    }
  };
  applyAdminPanel();
}

const eventTemplateKeys = [
  'title',
  'time',
  'endTime',
  'room',
  'info',
  'referent',
  'audience',
  'minAge',
  'maxAge',
  'mode',
  'cap',
  'count',
  'announcement',
  'image',
  'eventType',
];
function renderTemplates() {
  const list = $('templateList');
  if (!list) return;
  const signature = JSON.stringify([
    !!may('templates'),
    state.settings.eventTemplates,
  ]);
  if (list.dataset.signature === signature) return;
  list.dataset.signature = signature;
  list.replaceChildren();
  if (!may('templates')) return;
  for (const [name, model] of Object.entries(
    state.settings.eventTemplates || {},
  ).sort(([a], [b]) => a.localeCompare(b, 'fr'))) {
    const row = document.createElement('div');
    row.className = 'templateActions';
    const label = document.createElement('span');
    label.textContent = name + ' · ' + model.title;
    row.append(label);
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.textContent = 'Modifier';
    edit.setAttribute('aria-label', 'Modifier le modèle ' + name);
    edit.onclick = () => editTemplate(name);
    row.append(edit);
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = 'Supprimer';
    remove.setAttribute('aria-label', 'Supprimer le modèle ' + name);
    remove.onclick = async () => {
      if (
        confirm(
          'Supprimer le modèle « ' +
            name +
            ' » ? Les séances existantes seront conservées.',
        )
      )
        await command(
          'template.remove',
          { name, revision: state.settingsRevision },
          'Modèle supprimé.',
        );
    };
    row.append(remove);
    list.append(row);
  }
  if (!list.children.length)
    list.textContent =
      'Aucun modèle. Créer un premier modèle pour préparer les prochaines séances.';
}
function editTemplate(name = '') {
  if (!may('templates')) return;
  const m = state.settings.eventTemplates?.[name] || {},
    revision = state.settingsRevision;
  modal(
    name ? 'Modifier un modèle' : 'Créer un modèle',
    `<form id="templateForm"><p>Ces paramètres seront proposés pour une nouvelle séance ; aucune séance n’est créée ici.</p><div class="fields">
 ${field('Nom du modèle', 'name', name, 'text', 'required maxlength="100"')}${field('Titre de la séance', 'title', m.title || '', 'text', 'required maxlength="200"')}${select('Type d’animation (facultatif)', 'eventType', ['', ...(state.settings.eventTypes || []), ...(m.eventType && !(state.settings.eventTypes || []).includes(m.eventType) ? [m.eventType] : [])], m.eventType || '')}
 ${field('Heure de début', 'time', m.time || '14:00', 'time', 'required')}${field('Heure de fin', 'endTime', m.endTime || '15:00', 'time', 'required')}${select('Salle (facultative)', 'room', ['', 'Créazone', 'Salle JV'], m.room || '')}
 ${field('Renseignements', 'info', m.info || '')}${field('Intervenant ou référent', 'referent', m.referent || '')}${field('Public', 'audience', m.audience || '')}${field('Âge minimum (ans)', 'minAge', m.minAge ?? '', 'number', 'min="0" step="0.1"')}${field('Âge maximum (ans)', 'maxAge', m.maxAge ?? '', 'number', 'min="0" step="0.1"')}${select('Mode', 'mode', ['inscription', 'libre'], m.mode || 'inscription')}${field('Nombre maximal de participants (facultatif)', 'cap', m.cap ?? '', 'number', 'min="1"')}</div><label>Texte d’annonce<textarea name="announcement" rows="3">${esc(m.announcement || '')}</textarea></label>${field('Lien vers un visuel facultatif', 'image', m.image || '', 'url')}<p id="templateMsg" role="status"></p><button class="primary">Enregistrer le modèle</button></form>`,
  );
  const form = $('templateForm');
  form.onsubmit = (e) => {
    e.preventDefault();
    const values = Object.fromEntries(new FormData(form));
    for (const k of ['cap', 'minAge', 'maxAge'])
      values[k] = values[k] === '' ? null : +values[k];
    values.count = true;
    submit(
      form,
      'templateMsg',
      'template.save',
      {
        name: values.name.trim(),
        oldName: name,
        model: Object.fromEntries(
          eventTemplateKeys.map((k) => [k, values[k] ?? null]),
        ),
        revision,
      },
      () => {
        $('modal').close();
        notice('Modèle enregistré.');
        renderTemplates();
      },
    );
  };
}
// Exporter les agrégats filtrés, sans identité ni numéro de carte.
async function exportStats() {
  if (!admin() || !$('statsFilter').reportValidity() || !(await loadStats()))
    return;
  const cols = [
    'periode',
    'activite',
    'secteur',
    'poste',
    'jeu',
    'boite',
    'salle',
    'type',
    'heure',
    'categorie',
    'passages',
    'personnes',
    'enfants',
    'adultes',
    'accompagnateurs',
  ];
  const quote = (value) => {
    let v = String(value ?? '');
    if (/^[\s]*[=+@-]/.test(v)) v = "'" + v;
    return '"' + v.replace(/"/g, '""') + '"';
  };
  const csv =
    '\ufeff' +
    [cols, ...statsDisplay().map((x) => cols.map((k) => x[k] ?? ''))]
      .map((row) => row.map(quote).join(';'))
      .join('\r\n');
  const url = URL.createObjectURL(
      new Blob([csv], { type: 'text/csv;charset=utf-8' }),
    ),
    a = document.createElement('a');
  a.href = url;
  a.download =
    'statistiques-' +
    $('statsFilter').elements.from.value +
    '-' +
    $('statsFilter').elements.to.value +
    '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $('statsMsg').textContent =
    'Extraction CSV des statistiques affichées téléchargée.';
}
