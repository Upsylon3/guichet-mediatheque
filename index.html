<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guichet médiathèque</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#19382f;font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px clamp(14px,4vw,48px)}header,.bar,nav,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header,.bar{justify-content:space-between}h1,h2{font-family:Georgia,serif;line-height:1.15}h1{font-size:clamp(32px,5vw,55px);margin:8px 0}h2{font-size:28px}p{margin:8px 0}a{color:#235345}nav{margin:24px 0;border-bottom:1px solid #b6c6bc;padding-bottom:12px}button,input,select{font:inherit;border:1px solid #a8b9ad;border-radius:6px;padding:8px 12px;color:inherit;background:white;max-width:100%}button{cursor:pointer}button[aria-current=true],.primary{background:#225546;color:white;border-color:#225546}button:hover{border-color:#225546}section,dialog{background:#fff;border:1px solid #d4dccf;padding:clamp(14px,3vw,28px);border-radius:12px}dialog{color:inherit;width:min(500px,95vw);max-height:90vh}dialog::backdrop{background:#173d3266}label{display:grid;gap:3px;font-size:14px;font-weight:600;align-content:start}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(175px,100%),1fr));gap:12px}form>.actions,.actions{margin-top:14px}.muted,small{color:#51665b}.row{border-top:1px solid #dce3da;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;overflow-wrap:anywhere}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}.day{min-height:60px;padding:4px}.day small{display:block;overflow-wrap:anywhere;font-size:12px}.today{outline:2px solid #47755a}.day.busy{background:#e5efdc}.actions button{flex-shrink:0}dialog form{display:grid;gap:8px}#notice{min-height:1.6em;font-weight:600}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c98b26;outline-offset:2px}[hidden]{display:none!important}@media(max-width:530px){nav{gap:5px}nav button{padding:6px;font-size:14px}.day{min-height:48px}.day small{font-size:10px}}
</style>
<main><header><div><h1>Guichet médiathèque</h1><p class="muted">Démonstration locale · utiliser uniquement des données fictives</p></div><a href="https://mediatheques.montpellier3m.fr/accueil-general.aspx" target="_blank" rel="noopener">Catalogue du réseau ↗</a></header>
<nav aria-label="Activités"><button data-tab="soc" aria-current="true">Jeux de société</button><button data-tab="vid">Jeux vidéo</button><button data-tab="ani">Animations</button></nav>
<section id="soc"><div class="bar"><h2>Consultation sur place</h2><label>Secteur<select id="sector"><option>Jeunesse</option><option>Pop Zone</option></select></label></div>
<form id="board"><div class="fields"><label>Carte fictive<input name="card" required placeholder="ESSAI-01"></label><label>Nom facultatif<input name="person"></label><label>Numéro de boîte<input name="box" required></label><label>Enfants<input name="kids" type="number" min="0" value="1" required></label><label>Adultes<input name="adults" type="number" min="0" value="0" required></label></div><div class="actions"><button class="primary">Enregistrer</button></div></form><h3>Consultations du secteur</h3><div id="boards"></div></section>
<section id="vid" hidden><div class="bar"><h2>Créneaux de jeux vidéo</h2><button id="addvideo" class="primary">Inscrire</button></div><div id="videos"></div></section>
<section id="ani" hidden><div class="bar"><h2 id="month"></h2><div><button id="prev" aria-label="Mois précédent">‹</button> <button id="now">Aujourd’hui</button> <button id="next" aria-label="Mois suivant">›</button></div></div><div class="week" id="calendar"></div></section>
<p id="notice" role="status"></p><footer><a href="https://github.com/Upsylon3/guichet-mediatheque/blob/main/CAHIER-DES-CHARGES.md">Cahier des charges</a></footer></main>
<dialog id="modal"><div class="bar"><h2 id="heading"></h2><button id="close" aria-label="Fermer">×</button></div><div id="body"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date();
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const dateLabel=s=>new Date(s+'T12:00:00').toLocaleDateString('fr-FR');
const key='guichet-demo-v1';
let state=JSON.parse(localStorage.getItem(key)||'null')||{people:{},boards:[],videos:[],events:[],sector:'Jeunesse'};
let cursor=new Date(today.getFullYear(),today.getMonth(),1);
const posts={ZELDA:[1,'Exploration'],PEACH:[2,'Course'],MARIO:[4,'Circuit'],ELLIE:[2,'Aventure'],SACKBOY:[2,'Sports'],SPYRO:[1,'Voyage']};
let last=state.last||{date:iso(today),post:'MARIO',slot:'10:15',game:''};
function save(msg){localStorage.setItem(key,JSON.stringify(state));render();$('notice').textContent=msg}
function dialog(title,html){$('heading').textContent=title;$('body').innerHTML=html;if(!$('modal').open)$('modal').showModal()}
$('close').onclick=()=>$('modal').close();
function nameOf(card){return Object.hasOwn(state.people,card)?state.people[card]:''}
function remember(card,name){if(name.trim())Object.defineProperty(state.people,card,{value:name.trim(),enumerable:true,writable:true,configurable:true})}
function linkName(form){form.elements.card.oninput=()=>{form.elements.person.value=nameOf(form.elements.card.value.trim())}}
linkName($('board'));
document.querySelector('nav').onclick=e=>{if(!e.target.dataset.tab)return;for(const b of document.querySelectorAll('[data-tab]')){const active=b===e.target;$(b.dataset.tab).hidden=!active;b.setAttribute('aria-current',active)}$('notice').textContent=''};
$('sector').value=state.sector;$('sector').onchange=()=>{state.sector=$('sector').value;save('')};
$('board').onsubmit=e=>{e.preventDefault();const f=e.target.elements,c=f.card.value.trim(),b=f.box.value.trim();if(!c||!b)return;remember(c,f.person.value);state.boards.unshift({id:crypto.randomUUID(),card:c,box:b,kids:+f.kids.value,adults:+f.adults.value,sector:state.sector,date:iso(new Date())});e.target.reset();save('Consultation enregistrée.');f.card.focus()};
function rows(id,list,describe,collection){$(id).replaceChildren();if(!list.length){$(id).textContent='Aucune saisie.';return}
 for(const item of list){const row=document.createElement('div'),label=document.createElement('span'),button=document.createElement('button');row.className='row';label.textContent=describe(item);button.textContent='Retirer';button.onclick=()=>{state[collection]=state[collection].filter(x=>x.id!==item.id);save('Saisie retirée.')};row.append(label,button);$(id).append(row)}}
function render(){rows('boards',state.boards.filter(x=>x.sector===state.sector),x=>[dateLabel(x.date),nameOf(x.card)||x.card,'Boîte '+x.box,x.kids+' enf. + '+x.adults+' ad.'].join(' · '),'boards');rows('videos',state.videos,x=>[dateLabel(x.date),x.slot,x.post,nameOf(x.card)||x.card,x.game].filter(Boolean).join(' · '),'videos');calendar()}
const opts=items=>items.map(x=>'<option>'+escapeHtml(x)+'</option>').join('');
$('addvideo').onclick=()=>{dialog('Inscrire aux jeux vidéo','<form id="vf"><label>Jour<input name="date" type="date" required></label><label>Poste<select name="post">'+opts(Object.keys(posts))+'</select></label><label>Créneau<select name="slot"></select></label><label>Jeu facultatif<select name="game"></select></label><label>Carte fictive<input name="card" required></label><label>Nom facultatif<input name="person"></label><p id="vfmsg" role="status"></p><button class="primary">Inscrire</button></form>');
 const form=$('vf'),f=form.elements;f.date.value=last.date;f.post.value=last.post;
 function availability(){const used=state.videos.filter(x=>x.date===f.date.value&&x.slot===f.slot.value&&x.post===f.post.value).length;$('vfmsg').textContent=(posts[f.post.value][0]-used)+' place(s) disponible(s)'}
 function refresh(){const times=f.post.value==='SPYRO'?['10:15','13:45','15:15']:['10:15','11:15','13:45','14:45','15:45','16:45'];f.slot.innerHTML=opts(times);if(times.includes(last.slot))f.slot.value=last.slot;f.game.innerHTML='<option value="">Au choix</option>'+opts(posts[f.post.value].slice(1));if(f.post.value===last.post)f.game.value=last.game;availability()}
 refresh();f.post.onchange=refresh;f.slot.onchange=f.date.onchange=availability;linkName(form);
 form.onsubmit=e=>{e.preventDefault();const card=f.card.value.trim();if(!card)return;const same=state.videos.filter(x=>x.date===f.date.value&&x.slot===f.slot.value);if(same.some(x=>x.card===card)){$('vfmsg').textContent='Carte déjà inscrite à cet horaire.';return}if(same.filter(x=>x.post===f.post.value).length>=posts[f.post.value][0]){$('vfmsg').textContent='Créneau complet. Choisissez un autre horaire.';return}remember(card,f.person.value);last={date:f.date.value,post:f.post.value,slot:f.slot.value,game:f.game.value};state.last=last;state.videos.unshift({...last,card,id:crypto.randomUUID()});save('Inscription enregistrée.');f.card.value=f.person.value='';availability();$('vfmsg').textContent='Inscription enregistrée. '+$('vfmsg').textContent;f.card.focus()}};
function calendar(){$('month').textContent=cursor.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});const grid=$('calendar');grid.innerHTML=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>'<b>'+x+'</b>').join('');for(let i=0;i<(cursor.getDay()+6)%7;i++)grid.append(document.createElement('span'));
 for(let n=1;n<=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();n++){const d=iso(new Date(cursor.getFullYear(),cursor.getMonth(),n)),events=state.events.filter(x=>x.date===d),b=document.createElement('button');b.className='day'+(d===iso(today)?' today':'')+(events.length?' busy':'');b.textContent=n;for(const ev of events){const s=document.createElement('small');s.textContent=ev.title;b.append(s)}b.onclick=()=>day(d);grid.append(b)}}
$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);calendar()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);calendar()};$('now').onclick=()=>{cursor=new Date(today.getFullYear(),today.getMonth(),1);calendar()};
function day(d){dialog(dateLabel(d),'<div id="agenda"></div><button id="new" class="primary">Ajouter une animation</button>');for(const ev of state.events.filter(x=>x.date===d)){const b=document.createElement('button');b.textContent=ev.time+' · '+ev.title;b.onclick=()=>detail(ev);$('agenda').append(b)}$('new').onclick=()=>edit(d)}
function edit(d,ev){dialog(ev?'Modifier la séance':'Nouvelle animation','<form id="af"><label>Titre<input name="title" required></label><label>Jour<input type="date" name="date" required></label><label>Heure<input type="time" name="time" required></label><label>Lieu et renseignements<input name="info"></label><label>Nombre de places<input type="number" name="cap" required min="1"></label><button class="primary">Enregistrer</button></form>');const f=$('af').elements;f.title.value=ev?.title||'';f.date.value=d;f.time.value=ev?.time||'14:00';f.info.value=ev?.info||'';f.cap.value=ev?.cap||12;f.cap.min=Math.max(1,ev?.guests.length||0);$('af').onsubmit=e=>{e.preventDefault();const item=ev||{id:crypto.randomUUID(),guests:[]};Object.assign(item,{date:f.date.value,time:f.time.value,title:f.title.value,info:f.info.value,cap:+f.cap.value});if(!ev)state.events.push(item);cursor=new Date(item.date.slice(0,7)+'-01T12:00:00');save('Séance enregistrée.');detail(item)}}
function detail(ev){dialog(ev.title,'<p>'+escapeHtml(dateLabel(ev.date)+' · '+ev.time+' · '+ev.info)+'</p><p>'+ev.guests.length+' / '+ev.cap+' places</p><div id="guests"></div><form id="guest"><label>Carte fictive<input name="card" required></label><label>Nom facultatif<input name="person"></label><label>Âge facultatif (années)<input name="age" type="number" min="0"></label><button class="primary" '+(ev.guests.length>=ev.cap?'disabled':'')+'>Inscrire une personne</button></form><div class="actions"><button id="change">Modifier</button><button id="remove">Supprimer la séance</button></div>');
 for(const g of ev.guests){const r=document.createElement('div'),b=document.createElement('button');r.className='row';r.textContent=[nameOf(g.card)||g.card,g.age?g.age+' ans':''].filter(Boolean).join(' · ');b.textContent='Retirer';b.onclick=()=>{ev.guests=ev.guests.filter(x=>x!==g);save('Inscription retirée.');detail(ev)};r.append(b);$('guests').append(r)}
 linkName($('guest'));$('guest').onsubmit=e=>{e.preventDefault();const f=e.target.elements,c=f.card.value.trim();if(!c||ev.guests.length>=ev.cap)return;remember(c,f.person.value);ev.guests.push({card:c,age:f.age.value});save('Personne inscrite.');detail(ev)};$('change').onclick=()=>edit(ev.date,ev);$('remove').onclick=()=>{dialog('Supprimer cette séance ?', '<p>Les inscriptions de cette séance seront également supprimées.</p><div class="actions"><button id="cancel">Conserver</button><button id="yes">Supprimer</button></div>');$('cancel').onclick=()=>detail(ev);$('yes').onclick=()=>{state.events=state.events.filter(x=>x!==ev);save('Séance supprimée.');$('modal').close()}}}
render();
</script></html>
